name: taskflow_mobile
description: TaskFlow Project Management Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=2.19.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_secure_storage: ^8.0.0
  flutter_riverpod: ^2.3.6
  intl: ^0.18.1
  drag_and_drop_lists: ^0.3.2
  cupertino_icons: ^1.0.8
  dio: ^5.1.1
  go_router: ^7.0.0
  flutter_slidable: ^3.0.0
  cached_network_image: ^3.2.3
  flutter_dotenv: ^5.0.2
  uuid: ^3.0.7
  flutter_svg: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
